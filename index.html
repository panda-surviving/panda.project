<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio 360 - PSX, Crypto, Forex & Global Assets</title>
  <!-- Supabase JS Client & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1300px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.6rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .badge { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; border: 1px solid var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .val { font-size: 1.8rem; font-weight: 700; margin-top: 8px; }
    .card .green { color: var(--green); }
    .card .red { color: var(--red); }
    .dashboard-body { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .dashboard-body { grid-template-columns: 1fr; } }
    form { display: grid; gap: 12px; margin-top: 10px; }
    .form-row { display: flex; gap: 10px; }
    .form-row > * { flex: 1; }
    input, select, button { padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; }
    button { background: var(--accent); color: #000; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-secondary:hover { color: var(--text); border-color: var(--text); }
    .currency-toggle { background: var(--border); padding: 4px; border-radius: 8px; display: inline-flex; gap: 4px; }
    .currency-toggle button { padding: 4px 12px; font-size: 0.8rem; background: transparent; color: var(--muted); border-radius: 6px; }
    .currency-toggle button.active { background: var(--accent); color: #000; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .del-btn { background: #ef4444; color: white; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; }
    
    #authOverlay { position: fixed; inset: 0; background: rgba(11, 15, 25, 0.95); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .auth-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; text-align: center; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="authOverlay">
    <div class="auth-box">
      <h2 style="margin-bottom: 8px; color: var(--accent);">Portfolio 360</h2>
      <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 20px;">Manage PSX, Crypto, Forex & Global Assets in one place.</p>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Your Email" required>
        <input type="password" id="authPassword" placeholder="Password" required>
        <button type="submit" id="loginBtn">Sign In</button>
        <button type="button" class="btn-secondary" id="signupBtn">Create Free Account</button>
      </form>
      <div id="authError" style="color: #ef4444; font-size: 0.85rem; margin-top: 12px;"></div>
    </div>
  </div>

  <header>
    <h1>Portfolio 360 <span>🌐</span></h1>
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <div class="currency-toggle">
        <button id="currUSD" class="active" onclick="setCurrency('USD')">USD ($)</button>
        <button id="currPKR" onclick="setCurrency('PKR')">PKR (Rs)</button>
      </div>
      <span class="badge" id="userBadge">Not Authenticated</span>
      <button class="btn-secondary" id="logoutBtn" style="padding: 6px 12px; font-size: 0.8rem; display: none;">Sign Out</button>
    </div>
  </header>

  <section class="grid">
    <div class="card">
      <label>Total Net Worth</label>
      <div class="val" id="totalNetWorth">$0.00</div>
    </div>
    <div class="card">
      <label>Total Invested</label>
      <div class="val" id="totalInvested">$0.00</div>
    </div>
    <div class="card">
      <label>Total Profit / Loss</label>
      <div class="val green" id="totalGain">$0.00</div>
    </div>
    <div class="card">
      <label>USD / PKR Rate</label>
      <div class="val" id="forexRate" style="font-size: 1.4rem;">278.50 PKR</div>
    </div>
  </section>

  <div class="dashboard-body">
    <main>
      <div class="card">
        <h3>Add Multi-Market Asset</h3>
        <form id="assetForm">
          <div class="form-row">
            <input type="text" id="assetName" placeholder="Ticker/Symbol (e.g., ENGRO, AAPL, BTC, EUR/USD)" required>
            <select id="assetCategory">
              <option value="PSX">PSX Stock (Pakistan)</option>
              <option value="Global Stocks">US / Global Stock</option>
              <option value="Crypto">Crypto</option>
              <option value="Forex">Forex / Currency Pair</option>
              <option value="Mutual Funds">Mutual Funds / Commodities</option>
            </select>
          </div>
          <div class="form-row">
            <input type="number" id="investedAmount" placeholder="Invested Amount" step="0.01" required>
            <input type="number" id="currentValue" placeholder="Current Market Value" step="0.01" required>
            <select id="assetCurrency">
              <option value="USD">Currency: USD ($)</option>
              <option value="PKR">Currency: PKR (Rs)</option>
            </select>
          </div>
          <button type="submit">+ Add to Portfolio</button>
        </form>
      </div>

      <div class="card" style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
          <h3>Your Holdings</h3>
          <button id="syncPricesBtn" onclick="updateLivePrices()" style="padding: 6px 12px; font-size: 0.85rem;">
            🔄 Sync Live Market Prices
          </button>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Asset</th>
                <th>Market</th>
                <th>Invested</th>
                <th>Current Value</th>
                <th>Return</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="assetList"></tbody>
          </table>
        </div>
      </div>
    </main>

    <aside class="card">
      <h3>Asset Allocation</h3>
      <canvas id="allocationChart" style="margin-top: 20px;"></canvas>
    </aside>
  </div>

  <script>
    const SUPABASE_URL = "https://qfedipjndplthmjozaro.supabase.co".trim();
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZWRpcGpuZHBsdGhtam96YXJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODc0NDIsImV4cCI6MjEwMTc2MzQ0Mn0.1TxmSPwGOJp6KJCkb9J55HBpj4c57aAk96nv9A-MKAQ".trim();
    const FINNHUB_API_KEY = "d9rjvlpr01qoo7o419cg".trim();

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
    });

    let assets = [];
    let chartInstance = null;
    let selectedCurrency = 'USD';
    let usdPkrRate = 278.50;

    const cryptoMap = {
      "btc": "bitcoin", "bitcoin": "bitcoin", "eth": "ethereum",
      "ethereum": "ethereum", "sol": "solana", "solana": "solana"
    };

    const authOverlay = document.getElementById('authOverlay');
    const authForm = document.getElementById('authForm');
    const authError = document.getElementById('authError');
    const logoutBtn = document.getElementById('logoutBtn');
    const userBadge = document.getElementById('userBadge');

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        authOverlay.style.display = 'none';
        logoutBtn.style.display = 'block';
        userBadge.innerText = session.user.email;
        fetchUsdPkrRate();
        fetchAssets();
      } else {
        authOverlay.style.display = 'flex';
        logoutBtn.style.display = 'none';
        userBadge.innerText = 'Not Authenticated';
        assets = [];
        renderUI();
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.innerText = '';
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) authError.innerText = error.message;
    });

    document.getElementById('signupBtn').addEventListener('click', async () => {
      authError.innerText = '';
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      if (!email || !password) return authError.innerText = "Please enter email & password.";
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) authError.innerText = error.message;
      else authError.innerText = "Account created! You can now Sign In.";
    });

    logoutBtn.addEventListener('click', () => supabaseClient.auth.signOut());

    async function fetchUsdPkrRate() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        if (data && data.rates && data.rates.PKR) {
          usdPkrRate = data.rates.PKR;
          document.getElementById('forexRate').innerText = `${usdPkrRate.toFixed(2)} PKR`;
        }
      } catch (err) {
        console.warn("Using fallback PKR rate:", err);
      }
    }

    function setCurrency(curr) {
      selectedCurrency = curr;
      document.getElementById('currUSD').classList.toggle('active', curr === 'USD');
      document.getElementById('currPKR').classList.toggle('active', curr === 'PKR');
      renderUI();
    }

    async function fetchAssets() {
      const { data, error } = await supabaseClient.from('assets').select('*').order('created_at', { ascending: false });
      if (error) console.error(error);
      else {
        assets = data || [];
        renderUI();
      }
    }

    document.getElementById('assetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputCurrency = document.getElementById('assetCurrency').value;
      let investedVal = parseFloat(document.getElementById('investedAmount').value);
      let currentVal = parseFloat(document.getElementById('currentValue').value);

      // Store values normalized to USD
      if (inputCurrency === 'PKR') {
        investedVal /= usdPkrRate;
        currentVal /= usdPkrRate;
      }

      const newAsset = {
        name: document.getElementById('assetName').value.toUpperCase().trim(),
        category: document.getElementById('assetCategory').value,
        invested: investedVal,
        current: currentVal
      };

      const { data, error } = await supabaseClient.from('assets').insert([newAsset]).select();
      if (error) alert(error.message);
      else {
        assets.unshift(data[0]);
        renderUI();
        document.getElementById('assetForm').reset();
      }
    });

    async function deleteAsset(id) {
      const { error } = await supabaseClient.from('assets').delete().eq('id', id);
      if (error) alert(error.message);
      else {
        assets = assets.filter(a => a.id !== id);
        renderUI();
      }
    }

    async function updateLivePrices() {
      const syncBtn = document.getElementById('syncPricesBtn');
      if (syncBtn) syncBtn.innerText = "Syncing Markets...";

      for (let asset of assets) {
        const cleanName = asset.name.toLowerCase().trim();

        if (asset.category === "Crypto") {
          const coinId = cryptoMap[cleanName] || cleanName;
          try {
            const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`);
            const data = await res.json();
            if (data[coinId] && data[coinId].usd) {
              asset.current = data[coinId].usd;
              await supabaseClient.from('assets').update({ current: asset.current }).eq('id', asset.id);
            }
          } catch (err) { console.error(err); }
        }

        if (asset.category === "Global Stocks" && FINNHUB_API_KEY) {
          try {
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${asset.name}&token=${FINNHUB_API_KEY}`);
            const data = await res.json();
            if (data.c && data.c > 0) {
              asset.current = data.c;
              await supabaseClient.from('assets').update({ current: asset.current }).eq('id', asset.id);
            }
          } catch (err) { console.error(err); }
        }
      }

      renderUI();
      if (syncBtn) syncBtn.innerText = "🔄 Sync Live Market Prices";
    }

    function renderUI() {
      let totInvestedUSD = 0, totCurrentUSD = 0;
      const listEl = document.getElementById('assetList');
      listEl.innerHTML = '';
      const catTotals = {};

      const symbol = selectedCurrency === 'USD' ? '$' : 'Rs ';
      const multiplier = selectedCurrency === 'USD' ? 1 : usdPkrRate;

      assets.forEach(a => {
        totInvestedUSD += Number(a.invested);
        totCurrentUSD += Number(a.current);

        const currentConverted = Number(a.current) * multiplier;
        const investedConverted = Number(a.invested) * multiplier;

        catTotals[a.category] = (catTotals[a.category] || 0) + currentConverted;

        const gain = currentConverted - investedConverted;
        const gainPct = investedConverted > 0 ? ((gain / investedConverted) * 100).toFixed(1) : 0;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${a.name}</b></td>
          <td><span class="badge">${a.category}</span></td>
          <td>${symbol}${investedConverted.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
          <td>${symbol}${currentConverted.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
          <td style="color: ${gain >= 0 ? 'var(--green)' : 'var(--red)'}">${gain >= 0 ? '+' : ''}${symbol}${gain.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} (${gainPct}%)</td>
          <td><button class="del-btn" onclick="deleteAsset(${a.id})">Delete</button></td>
        `;
        listEl.appendChild(tr);
      });

      const totCurrent = totCurrentUSD * multiplier;
      const totInvested = totInvestedUSD * multiplier;
      const netGain = totCurrent - totInvested;

      document.getElementById('totalNetWorth').innerText = `${symbol}${totCurrent.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      document.getElementById('totalInvested').innerText = `${symbol}${totInvested.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      
      const netGainEl = document.getElementById('totalGain');
      netGainEl.innerText = `${netGain >= 0 ? '+' : ''}${symbol}${netGain.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      netGainEl.style.color = netGain >= 0 ? 'var(--green)' : 'var(--red)';

      renderChart(catTotals, symbol);
    }

    function renderChart(catTotals, symbol) {
      const ctx = document.getElementById('allocationChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(catTotals),
          datasets: [{
            data: Object.values(catTotals),
            backgroundColor: ['#38bdf8', '#22c55e', '#a855f7', '#f59e0b', '#ec4899']
          }]
        },
        options: {
          plugins: {
            legend: { labels: { color: '#f8fafc' } }
          }
        }
      });
    }
  </script>
</body>
</html>
